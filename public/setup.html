<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#141310">
  <title>Set up · Remind Me</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="sovereign-fonts.css">
  <link rel="stylesheet" href="sovereign-chassis.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="remind-skin.css">
  <script src="theme.js"></script>
</head>
<body class="page-setup">
  <div id="app">
    <header class="topbar">
      <span class="brand"><img src="favicon.svg" alt="" width="32" height="32"><span>Remind Me</span></span>
      <div class="topbar-actions"><button type="button" class="icon-btn" data-theme-toggle aria-label="Theme"></button></div>
    </header>

    <h1 class="page-title">Who gets reminders?</h1>
    <p class="page-sub">Add the people in your household. Next you’ll paste each person’s brrr key so their phone can be reached.</p>

    <form id="setup-form" class="person-card" autocomplete="off">
      <div class="setup-list" id="setup-list"></div>
      <button type="button" class="btn-ghost" id="add-row">+ Add another person</button>
      <p class="person-error hidden" id="setup-error" role="alert"></p>
      <button type="submit" class="schedule-btn" id="setup-submit">Continue</button>
    </form>
  </div>

  <script src="shared/schedule-core.js"></script>
  <script src="common.js"></script>
  <script src="setup.js"></script>
</body>
</html>
