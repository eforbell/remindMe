<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#141310">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Remind Me">
  <meta name="format-detection" content="telephone=no">
  <title>Remind Me</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="sovereign-fonts.css">
  <link rel="stylesheet" href="sovereign-chassis.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="remind-skin.css">
  <script src="theme.js"></script>
</head>
<body class="page-home">
  <div id="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Remind Me home">
        <img src="favicon.svg" alt="" width="32" height="32">
        <span>Remind Me</span>
      </a>
      <div class="topbar-actions">
        <button type="button" id="me-btn" class="me-chip hidden" aria-label="Who is using this phone"></button>
        <a class="icon-btn" href="people" aria-label="People and brrr keys">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 4.9"/></svg>
        </a>
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Theme"></button>
      </div>
    </header>

    <main class="home">
      <div id="banners" class="banners" aria-live="polite"></div>

      <section class="next-up" id="next-up" aria-live="polite">
        <div class="next-label">Next up</div>
        <div class="next-body" id="next-body"><span class="skeleton line" style="width:60%"></span></div>
      </section>

      <div class="home-actions">
        <button type="button" id="new-btn" class="big-btn big-btn-primary">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>New reminder</span>
        </button>
        <button type="button" id="list-btn" class="big-btn big-btn-secondary">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>Scheduled</span>
          <span class="count-badge" id="list-count">0</span>
        </button>
      </div>

      <p class="status-line" id="status-line"></p>
    </main>
  </div>

  <!-- ── Composer: new / edit reminder ─────────────────────────────────── -->
  <div class="overlay hidden" id="composer" aria-hidden="true">
    <form class="overlay-box composer" role="dialog" aria-modal="true" aria-labelledby="composer-title" id="composer-form" novalidate autocomplete="off">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <div class="modal-head">
        <div>
          <h2 id="composer-title">New reminder</h2>
          <p class="modal-sub" id="composer-sub">Delivered by brrr on the quarter hour.</p>
        </div>
        <button type="button" class="modal-close" data-close aria-label="Close">&times;</button>
      </div>

      <div class="modal-body composer-body">
        <section class="field" aria-labelledby="what-label">
          <label class="field-label" id="what-label" for="what">What</label>
          <div class="what-wrap">
            <input id="what" name="what" type="text" maxlength="120" enterkeyhint="done" autocapitalize="sentences"
                   autocorrect="on" spellcheck="true" placeholder="Take medicine" aria-describedby="what-help">
            <button type="button" class="what-clear hidden" id="what-clear" aria-label="Clear">&times;</button>
          </div>
          <p class="field-help" id="what-help">Try “remind me to take my medicine tomorrow at 5pm”.</p>
          <div class="quick hidden" id="quick" aria-live="polite"></div>
          <ul class="suggestions hidden" id="suggestions" role="listbox" aria-label="Past reminders"></ul>
        </section>

        <section class="field" aria-labelledby="who-label">
          <div class="field-label" id="who-label">Who</div>
          <div class="people-chips" id="who-chips" role="group" aria-labelledby="who-label"></div>
          <p class="field-help" id="who-help"></p>
        </section>

        <section class="field" aria-labelledby="when-label">
          <div class="field-label-row">
            <div class="field-label" id="when-label">When</div>
            <div class="when-readout" id="when-readout"></div>
          </div>
          <div class="date-quick" id="date-quick" role="group" aria-label="Quick dates"></div>
          <div class="calendar" id="calendar"></div>
          <div class="timepicker" id="timepicker" role="group" aria-label="Time"></div>
          <p class="field-help" id="tz-help"></p>
        </section>

        <section class="field" aria-labelledby="repeat-label">
          <div class="field-label" id="repeat-label">Repeat</div>
          <div class="segmented seg-repeat" id="repeat-seg" role="radiogroup" aria-labelledby="repeat-label"></div>
          <div class="repeat-detail hidden" id="repeat-detail"></div>
        </section>

        <section class="field" aria-labelledby="level-label">
          <div class="field-label" id="level-label">Alert</div>
          <div class="levels" id="levels" role="radiogroup" aria-labelledby="level-label"></div>
        </section>
      </div>

      <div class="modal-foot composer-foot">
        <p class="composer-summary" id="composer-summary"></p>
        <p class="composer-error hidden" id="composer-error" role="alert"></p>
        <button type="submit" class="schedule-btn" id="schedule-btn">Schedule</button>
      </div>
    </form>
  </div>

  <!-- ── Scheduled reminders ──────────────────────────────────────────── -->
  <div class="overlay hidden" id="scheduled" aria-hidden="true">
    <div class="overlay-box scheduled-box" role="dialog" aria-modal="true" aria-labelledby="scheduled-title">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <div class="modal-head">
        <div>
          <h2 id="scheduled-title">Scheduled</h2>
          <p class="modal-sub" id="scheduled-sub"></p>
        </div>
        <button type="button" class="modal-close" data-close aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="scheduled-list" class="reminder-list"></div>
        <details class="recent" id="recent">
          <summary>Recently sent</summary>
          <ul class="recent-list" id="recent-list"></ul>
        </details>
      </div>
    </div>
  </div>

  <!-- ── Who is using this phone ──────────────────────────────────────── -->
  <div class="overlay hidden" id="whoami" aria-hidden="true">
    <div class="overlay-box whoami-box" role="dialog" aria-modal="true" aria-labelledby="whoami-title">
      <div class="modal-head">
        <div>
          <h2 id="whoami-title">Who’s using this phone?</h2>
          <p class="modal-sub">So “remind me” means you. You can change this any time.</p>
        </div>
        <button type="button" class="modal-close" data-close aria-label="Close">&times;</button>
      </div>
      <div class="modal-body"><div class="whoami-list" id="whoami-list"></div></div>
    </div>
  </div>

  <script src="shared/schedule-core.js"></script>
  <script src="shared/quick-parse.js"></script>
  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
