# Local development database. App: npm run dev (reads .env).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: remindme
      POSTGRES_PASSWORD: remindme
      POSTGRES_DB: remindme
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
